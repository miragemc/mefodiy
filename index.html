<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мефодий 🦉 — бот по правописанию русского языка</title>
<meta name="description" content="Мефодий — дружелюбный бот-сова 🦉. Проверяет правописание русских слов: при ошибке показывает правильное написание и правило русского языка. Работает офлайн, словарь на 12 000+ слов.">
<meta property="og:title" content="Мефодий 🦉 — бот по правописанию русского языка">
<meta property="og:description" content="Проверяет правописание русских слов: правильное написание и правило при ошибке.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦉%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --lilac-dark:  #2c1b45;
    --lilac:       #5b3a8c;
    --lilac-light: #8b6fb8;
    --lilac-pale:  #f1e9fb;
    --gold:        #d4af37;
    --gold-soft:   #e8c86a;
    --gold-deep:   #a8822c;
    --gold-pale:   #fdf6e0;
  }

  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(212,175,55,.22), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(139,111,184,.35), transparent 50%),
      linear-gradient(160deg, #2c1b45 0%, #4b2e6e 40%, #6d4a9c 75%, #3a2560 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 12px;
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: linear-gradient(180deg, #fdfbff 0%, #f7f1fc 100%);
    border-radius: 24px;
    border: 2px solid rgba(212,175,55,.55);
    box-shadow: 0 24px 60px rgba(20,8,40,.55), 0 0 40px rgba(212,175,55,.18);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 640px;
  }

  /* --- название бота сверху --- */
  header {
    background: linear-gradient(90deg, #5b3a8c 0%, #7a55a8 55%, #a8822c 100%);
    color: #fff;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 3px solid var(--gold);
  }

  .avatar {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(160deg, #fff8e1, #f3e2ad);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
    border: 2px solid var(--gold);
    box-shadow: 0 4px 14px rgba(0,0,0,.3), 0 0 12px rgba(212,175,55,.55);
  }

  .title h1 {
    font-size: 26px;
    letter-spacing: 1px;
    color: var(--gold-soft);
    text-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .title p { font-size: 13px; opacity: .92; margin-top: 2px; }

  /* --- строка ввода --- */
  .input-row {
    display: flex;
    gap: 10px;
    padding: 16px 18px;
    background: linear-gradient(180deg, #f4ecfd, #efe4fb);
    border-bottom: 1px solid #e0d0f2;
  }

  #wordInput {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    font-size: 17px;
    border: 2px solid #d5c2ec;
    border-radius: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    background: #fff;
    color: var(--lilac-dark);
  }

  #wordInput::placeholder { color: #a48fc4; }

  #wordInput:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(212,175,55,.25);
  }

  #checkBtn {
    padding: 13px 22px;
    font-size: 16px;
    font-weight: 700;
    color: #2c1b45;
    background: linear-gradient(135deg, var(--gold-soft) 0%, var(--gold) 55%, var(--gold-deep) 100%);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(168,130,44,.4);
    transition: transform .12s, filter .2s, box-shadow .2s;
  }

  #checkBtn:hover  { filter: brightness(1.08); box-shadow: 0 6px 16px rgba(168,130,44,.55); }
  #checkBtn:active { transform: scale(.96); }

  /* --- лента сообщений --- */
  #chat {
    flex: 1;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    background:
      radial-gradient(circle at 100% 0%, rgba(212,175,55,.08), transparent 40%),
      linear-gradient(180deg, #faf6ff, #f5effc);
  }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: pop .25s ease;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg .mini {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(160deg, #fff8e1, #f3e2ad);
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(91,58,140,.25);
  }

  .bubble {
    max-width: 78%;
    padding: 12px 15px;
    border-radius: 16px;
    font-size: 15.5px;
    line-height: 1.45;
    box-shadow: 0 2px 8px rgba(60,30,100,.12);
  }

  .msg.bot  .bubble {
    background: #fff;
    border: 1px solid #e6d8f6;
    border-bottom-left-radius: 4px;
  }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--lilac) 0%, #7a55a8 100%);
    color: #fff;
    border: 1px solid var(--gold-soft);
    border-bottom-right-radius: 4px;
  }

  .msg.bot  .bubble.good,
  .msg.bot  .bubble.bad,
  .msg.bot  .bubble.info { border-left-width: 5px; border-left-style: solid; }

  .msg.bot  .bubble.good { background: #f6f1fd; border-color: #e6d8f6; border-left-color: var(--gold); }
  .msg.bot  .bubble.bad  { background: #fdf0f5; border-color: #f3d7e4; border-left-color: #b8568a; }
  .msg.bot  .bubble.info { background: var(--gold-pale); border-color: #f0e2b8; border-left-color: var(--gold-deep); }

  .word-correct {
    display: block;
    font-size: 21px;
    font-weight: 700;
    margin: 6px 0;
    color: var(--lilac);
    word-break: break-word;
  }

  .rule-label {
    font-weight: 700;
    color: var(--gold-deep);
    display: block;
    margin-top: 8px;
  }

  footer {
    padding: 10px 18px 16px;
    font-size: 12px;
    color: #8a76ad;
    text-align: center;
    background: linear-gradient(180deg, #efe4fb, #ead9f8);
    border-top: 1px solid #e0d0f2;
  }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--lilac-light);
    animation: blink 1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity:.25 } 30% { opacity:1 } }
</style>
</head>
<body>
  <div class="card">
    <header>
      <div class="avatar">🦉</div>
      <div class="title">
        <h1>Мефодий</h1>
        <p>Я проверю правописание русского слова и объясню правило</p>
      </div>
    </header>

    <div class="input-row">
      <input id="wordInput" type="text" placeholder="Впиши русское слово…" autocomplete="off" autofocus>

  function normalize(text) {

  function lev(a, b, limit) {
    if (Math.abs(a.length - b.length) > limit) return limit + 1;
    const prev = new Array(b.length + 1);
    const cur = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {

      for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
    }
    return prev[b.length];

    ["раз","рас","Приставка раз- изменяется на рас- перед ц, ч, щ, ж, ш и с: рассвет, расцвести, расширение."],
    ["ис","из","Приставка ис- пишется перед ц, ч, щ, ж, ш и с, а также в словах исход, искра, история, искренний. Тут — из-: изменить, измерить."],
    ["из","ис","Приставка из- изменяется на ис- перед ц, ч, щ, ж, ш и с: испечь, испугаться, исцелить, исчезнуть."],
    ["вос","воз","Приставка воз- изменяется на вос- перед ц, ч, щ, ж, ш и с: восход, восстановить, воспитать."],
    ["воз","вос","Приставка воз- изменяется на вос- перед ц, ч, щ, ж, ш и с: восход, восстановить."],
    ["вз","всп","Запоминаем: вспомнить, всплеск, вспышка — после п пишется с."],
    ["через","чрез","Пишется приставка через-: черезвычайный (просторечное — черезчайный)."],
    ["чрез","через","В русском языке есть приставка через-: черезвычайный, через дорогу."],
    ["перед","пред","Приставка пред- означает «до, перед чем-либо» и пишется как слово «пред»: предложить, представить, предыдущий."],
    ["пред","перед","Приставка перед- означает перемещение: передать, передний, передвигать. Для «до» — пред-: предложить."],
    ["пере","при","Приставка пере- = повторное действие, движение через что-то, чрезмерность: переменить, перечитать, перебежать."],
    ["при","пере","Приставка при- = присоединение, приближение, неполнота: принять, приехать, приоткрыть."],
    ["пре","пере","Приставка пре- означает «очень, весьма»: прекрасный, премьер, прежний."],
    ["пере","пре","Приставка пере- (повтор, движение) здесь не подходит: слово пишется с пре- (очень): прекрасный, прежний."]
  ];

  function ruleFor(wrong, right) {
    /* приставки */
    for (const [wp, rp, text] of PREFIX_RULES) {
      if (wrong.startsWith(wp) && right.startsWith(rp) &&
          lev(wrong.slice(wp.length), right.slice(rp.length), 2) <= 2) {
        return text;
      }
    }
    /* не / ни */
    if ((wrong.startsWith("не") && right.startsWith("ни") || wrong.startsWith("ни") && right.startsWith("не")) &&
        lev(wrong.slice(2), right.slice(2), 2) <= 2) {
      return "Не пишется раздельно, а ни — слитно и означает отрицание: не знаю, ни души, ни один. Проверь, есть ли противопоставление.";
    }

    const i = firstDiff(wrong, right);
    const w = wrong[i], r = right[i];
    const before = right.slice(Math.max(0, i - 1), i);

    /* мягкий знак */
    if (r === "ь" || w === "ь") {
      if (before === "ч" || before === "щ") return "Мягкий знак пишется после ч и щ в конце слов: ночь, дочь, вещь, соль, мышь.";
      if (before === "ж" || before === "ш") return "После ж и ш мягкий знак не пишется (кроме глаголов 2-го лица и существительных женского рода): лежишь, дрожь.";
      return "В конце слова после согласной пишется мягкий знак: ночь, мышь, ложь, дружь, соль.";
    }
    /* тся / ться */
    if (/тс[яя]$/.test(wrong) && /тьс[яя]$/.test(right)) return "В инфинитиве после т пишется мягкий знак: -ться (слушаться, смеяться, делаться).";
    if (/тьс[яя]$/.test(wrong) && /тс[яя]$/.test(right)) return "У глаголов 3-го лица пишется -тся без мягкого знака: любится, делается, идёт, смеётся.";
    /* жи / ши */
    if ((wrong[i] === "ы" && right[i] === "и") && (before === "ж" || before === "ш")) {
      return "После ж и ш никогда не пишется ы — всегда и: жизнь, жир, широкий, шишка.";
    }
    /* ё */
    if (r === "ё" || w === "ё") {
      return "Буква ё пишется в ударном слоге вместо е: ёлка, жёлтый, берёза, счёт, щётка. Проверь ударение.";
    }
    /* с/з + ч */
    if (r === "ч" && w === "щ" && (before === "с" || before === "з")) {
      return "После с и з в этих словах пишется ч: счастье, счастливый, расстаться.";
    }
    if (r === "ж" && (before === "м" || w === "д")) {
      return "В слове мужчина пишется жд: муж + чина.";
    }
    /* н / нн */
    if (r === "н" && w === "н" && right.slice(i).startsWith("нн") && !wrong.slice(i).startsWith("нн")) {
      return "Нн пишется после приставок и в суффиксах прилагательных: стеклянный, деревянный, оловянный, чёрствый.";
    }
    if (w === "н" && r === "н" && wrong.slice(i).startsWith("нн") && !right.slice(i).startsWith("нн")) {
      return "Без приставки в суффиксах пишется одна н: ранний, утренний, последний.";
    }
    /* шипящие + гласная (о/а) */
    if (VOWELS.includes(w) && VOWELS.includes(r)) {
      if (before === "ж" || before === "ш" || before === "ч" || before === "щ" || before === "ц") {
        return "После шипящих и ц без ударения пишется о: шапка, чашка, журнал, щавель. Под ударением — а или ё. Проверь ударением.";
      }
      return "Это гласная в корне: её нужно проверить ударением или однокоренным словом (пятно — пятёрка, подарок — подарить).";
    }
    /* парные согласные */
    if (PAIRS[w] === r || PAIRS[r] === w) {
      return "Это парная согласная (б—п, в—ф, д—т, з—с, г—к). Проверь корень слова ударением или однокоренным словом: подарок — подарить, лодка — лодочка.";
    }
    /* пропущенная/лишняя согласная */
    if (Math.abs(wrong.length - right.length) === 1 && (VOWELS.includes(w) === VOWELS.includes(r))) {
      return "В этом корне согласная не произносится, но пишется: запомни написание (честный, лестница, праздник, грустный, сердце, средство).";
    }
    return "Проверь написание слова по орфографическому словарю и подбери проверочное слово.";
  }

  /* ---------- поиск по словарю ---------- */
  function inDict(word) { return WORD_SET.has(word); }

  function suggest(word) {
    const limit = word.length <= 5 ? 1 : (word.length <= 9 ? 2 : 3);
    const maxLenDiff = limit >= 2 ? 1 : 0;
    let best = null, bestD = limit + 1;
    for (const cand of WORD_SET) {
      if (Math.abs(cand.length - word.length) > maxLenDiff) continue;
      const d = lev(word, cand, limit);
      if (d < bestD) { bestD = d; best = cand; if (d === 1) break; }
    }
    return bestD <= limit ? best : null;
  }

  function checkWord(word) {
    if (WRONG[word] && WRONG[word][0] !== word) {
      return { type: "bad", word: word, correct: WRONG[word][0], rule: WRONG[word][1] };
    }
    if (inDict(word)) return { type: "good", word: word };
    const s = suggest(word);
    if (s && s !== word) {
      return { type: "bad", word: word, correct: s, rule: ruleFor(word, s) };
    }
    if (s === word) return { type: "good", word: word };
    return { type: "unknown", word: word };
  }

  /* ---------- отображение ---------- */
  function addMsg(side, html, cls) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + side;
    if (side === "bot") {
      const mini = document.createElement("div");
      mini.className = "mini";
      mini.textContent = "🦉";
      wrap.appendChild(mini);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble " + (cls || "");
    bubble.innerHTML = html;
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function botAnswer(words) {
    const typing = addMsg("bot", '<span class="typing"><span></span><span></span><span></span></span>');
    setTimeout(function () {
      if (!words.length) {
        typing.innerHTML = "Напиши одно русское слово в строку сверху — и я сразу его проверю.";
        typing.className = "bubble info";
        return;
      }
      let html = "";
      let anyBad = false;
      words.forEach(function (word) {
        const res = checkWord(word);
        if (res.type === "good") {
          html += '<b>✅ Молодец! Слово «' + esc(word) + '» написано правильно!</b><br>';
        } else if (res.type === "bad") {
          anyBad = true;
          html += 'Так не пишется. Правильно: <span class="word-correct">' + esc(res.correct) + '</span>' +
                  '<span class="rule-label">Правило:</span>' + esc(res.rule) + '<br>';
        } else {
          html += '🤔 Я не нашёл слова «' + esc(word) + '» в своём словаре. Проверь его ещё раз и напиши точно.<br>';
        }
      });
      typing.innerHTML = html;
      typing.className = "bubble " + (anyBad ? "bad" : "good");
      chat.scrollTop = chat.scrollHeight;
    }, 450);
  }

  function handle() {
    const words = normalize(input.value).slice(0, 5);
    if (!words.length) {
      botAnswer([]);
      input.value = "";
      return;
    }
    addMsg("user", esc(words.join(words.length > 1 ? " " : "")));
    botAnswer(words);
    input.value = "";
    input.focus();
  }

  btn.addEventListener("click", handle);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") handle();
  });

  /* приветствие */
  addMsg("bot", "Привет! Я <b>Мефодий</b> 🦉 — бот по правописанию.<br>Впиши русское слово в строку сверху и нажми «Проверить» — я скажу, написано ли оно правильно, а если нет — покажу правильное написание и объясню правило.");

  /* для отладки и тестов */
  window.MefodiyCheck = checkWord;
  })();
  </script>
